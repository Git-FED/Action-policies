# Copy this file to .github/workflows/ and replace the paths with real packages.
name: Monorepo CI (optimized)

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/api/**'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run test --workspace=packages/web
      - run: npm run test --workspace=packages/api

